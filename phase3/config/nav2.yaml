      #     writes 253 to every cell within the inscribed radius of an obstacle.
      #     So a path can only exist down a corridor WIDER THAN TWICE it.
      #   - RPP's use_collision_detection sweeps the SAME padded footprint
      #     forward along its arc and aborts FollowPath on any lethal cell.
      # A gap the rover fits through but the planner rejects therefore fails
      # twice over: no path, and no permission to drive the path there isn't.
      #
