# nav2 for this rover — Phase 3/4.
#
# THE FRAME IS odom, NOT map.
#   There is no map frame until something localizes against a saved map
#   (Phase 2c/2d). Everything here navigates inside one session, relative to
#   where the rover started. That is enough to click a goal and drive to it; it
#   is not enough to recognise a room tomorrow.
#
# THIS ROVER CANNOT TURN IN PLACE.
#   Measured 2026-08-21, TODO 14: a pivot command drives instead of turning --
#   the two sides never counter-rotate. So every rotate-in-place behaviour here
#   is disabled or avoided, and the rover is treated as steering by arcs. That is
#   a workaround, not a fix; when 14 is fixed, revisit every setting flagged
#   NO-PIVOT below.

amcl:
  ros__parameters:
    use_sim_time: false
    # Present but unused: AMCL needs a map to localize against. Phase 2d.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom          # not map -- see the header
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # NO-PIVOT. nav2's default tree hard-requires a `spin` action server, so
    # removing the Spin behaviour made bt_navigator refuse to load entirely:
    #   "spin action server not available" -> "Exception when loading BT"
    # This tree is the default with Spin replaced by a second, longer BackUp.
    default_nav_to_pose_bt_xml: /opt/rover3/bt/navigate_no_spin.xml
    # BOTH default trees must be overridden. bt_navigator loads them both at
    # startup, so leaving navigate_through_poses on the stock file fails the
    # whole bringup even when nothing ever calls it.
    default_nav_through_poses_bt_xml: /opt/rover3/bt/navigate_through_no_spin.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odom
    # Below these the rover is considered stopped. 0.01 matches the firmware's
    # own dead zone in pidStep(), so nav2 and the board agree on "not moving".
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.5      # differential drive: y is never commanded
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # 5 cm. Was 15, which is a sensible NAVIGATION tolerance -- but the
      # checker fires the moment it is satisfied, so a 15 cm tolerance makes
      # every goal land systematically short: the 1 m goal on 2026-08-22 stopped
      # at 85.7 cm and was declared reached. 5 cm is above the ~2 cm the pose
      # was tape-confirmed to, so it is asking for precision the estimate can
      # actually supply rather than making the rover chase its own noise.
      xy_goal_tolerance: 0.05
      # 0.25 rad = 14 deg, tightened from 0.5 now that the rover can rotate in
      # place to fix its final heading. At 0.5 the first autonomous goal was
      # declared reached while 23 deg off and still commanding 0.9 rad/s.
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Regulated Pure Pursuit follows a path by aiming at a point ahead of it
      # and arcing toward it. Chosen over DWB because it steers by arcs
      # naturally rather than sampling rotations this rover cannot execute.
      desired_linear_vel: 0.18         # teleop proved 0.20 m/s tracks cleanly
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true

      # TRUE since 2026-08-22. This was false for as long as the rover could not
      # pivot: RPP would have stopped and commanded a rotation that never
      # happened, until the progress checker timed out.
      #
      # The pivot fault is fixed and verified on the floor (93% and 96% duty,
      # counter-rotating, 65 deg/s -- TODO 14), so the reason has expired. And
      # leaving it false has a real cost, measured on the first autonomous goal:
      # with heading correctable only by driving an arc, the rover overshot a
      # 1 m goal to 1.13 m, came back, and hunted around it for 13 seconds of a
      # 6-second journey, crawling at 0.05 m/s while turning at the full
      # 1.0 rad/s limit. It was buying heading with forward motion because that
      # was the only currency it had.
      use_rotate_to_heading: true

      # Kept well under the 65 deg/s (1.13 rad/s) the rover actually achieved on
      # the floor, so a commanded in-place rotation is one it can execute.
      # MEASURED 2026-08-23 by sweeping commanded wz and reading back /odom:
      #
      #   commanded   measured
      #     0.15        0.00     <- RPP was stuck here, and it does nothing
      #     0.30        0.01
      #     0.50        0.03
      #     0.80        0.11     <- breakaway: below this the rover does not turn
      #     1.00        0.21
      #     2.00        0.59
      #     3.00        0.86
      #
      # Two separate faults. There is a DEADBAND below ~0.8 rad/s where skid
      # scrub is never broken and the wheels simply sit, and above it commanded
      # wz still runs about 3.4x optimistic because the firmware converts wz to
      # wheel speeds using the physical 0.34 m track while the rover actually
      # rotates about an effective 0.52 m (TODO 13) -- and saturates on top.
      #
      # 2.0 commanded gives ~0.59 rad/s (34 deg/s) actual, which is a usable
      # in-place turn and well inside the 65 deg/s the chassis has done.
      # 1.0 commanded is ~0.21 rad/s (12 deg/s) actual. Deliberately modest:
      # 2.0 was tried and overshot badly -- 23.6 cm off, 59 deg of heading
      # change, and nav2 fell back on its backup recovery. RPP predicts the arc
      # it will sweep from the twist it COMMANDS, and while commanded and actual
      # differ by 3.4x every one of those predictions is wrong, so a faster
      # commanded turn just overshoots faster. Until the mapping is corrected
      # (TODO 22) the controller has to be kept slow enough that its own error
      # stays small.
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.6

      # 10.0, because RPP clamps its rotate-to-heading output to
      # curr_speed +/- max_angular_accel * dt, and curr_speed comes from
      # ODOMETRY. From a standstill the first step is max_angular_accel * 0.1 s.
      # At 1.5 that was 0.15 rad/s, which is inside the deadband -- so the rover
      # never moved, curr_speed stayed 0, and the clamp never rose. A deadlock,
      # and it cost 35 seconds of a 53-second 1.2 m run spent commanding 0.15
      # and going nowhere. 10.0 makes the first step 1.0 rad/s, clear of the
      # 0.8 breakaway on the very first tick.
      max_angular_accel: 10.0
      allow_reversing: false           # cuVSLAM under-reads reverse by ~6%

      # Slow down near obstacles and on tight curves rather than cornering hard.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # 0.6 m was the OTHER half of the crawl. On a 1 m goal it begins slowing
      # 60 cm out -- most of the journey spent decelerating. 0.25 m still gives
      # a controlled arrival without turning every short hop into a creep.
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.25

      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      # TRUE since 2026-08-23, and this is a real trade rather than a tidy-up.
      #
      # A forward-facing camera can never see the floor the rover is standing on,
      # so the rover's OWN cell is unknown until something observes it from
      # elsewhere. NavFn cannot start a wavefront from an unknown cell, so with
      # allow_unknown false every goal fails immediately after a fresh start --
      # measured today: rover cell UNKNOWN, free space plainly visible 20 cm
      # ahead, NO_VALID_PATH in every direction. It cannot plan until it moves
      # and cannot move until it plans.
      #
      # What this costs: the planner will route through unmapped floor. Unknown
      # is not the same as empty, and this rover's blind spots are real -- it
      # sees nothing below 10 cm, nothing overhanging above 22 cm, nothing
      # outside 87 deg, and nothing downward at all.
      #
      # What still protects it: the local costmap and the controller's own
      # collision check (use_collision_detection, 1.5 s to collision) run during
      # execution, and nav2 replans as new ground is observed. Those guard the
      # DRIVING; nothing guards the blind spots, which is why autonomous runs
      # still need a human watching.
      allow_unknown: true              # was false:
                                       # 79% of this map is still unknown, and
                                       # planning into it would drive blind.

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true             # no map frame, so the costmap follows
      width: 12                        # the rover rather than covering a fixed
      height: 12                       # world
      resolution: 0.05                 # matches the nvblox voxel size
      track_unknown_space: true
      # Publish the WHOLE costmap every cycle, not just incremental updates.
      # By default nav2 sends one full map on a size change and deltas after,
      # so a subscriber that connects later -- RViz, or a health check -- sees
      # nothing at all despite the costmap running perfectly. Costs bandwidth on
      # a 12 m grid; worth it for something you have to be able to look at.
      always_send_full_costmap: true

      # MEASURED, not guessed. From the rover centre:
      #   front  +0.180  camera front face (17.0 cm + ~1 cm deep)
      #   rear   -0.170  rear wheel centre + wheel radius (12.5 + 4.25)
      #   side   +/-0.190  wheel centre (17.0) + ~2 cm tyre half-width
      # => 35 cm long x 38 cm wide. The tyre half-width is the one assumption;
      # verify with a tape before trusting it through a tight gap.
      footprint: "[[0.180, 0.190], [0.180, -0.190], [-0.170, -0.190], [-0.170, 0.190]]"
      # 7 cm of padding, added 2026-08-23 after the rover was seen grazing
      # obstacles by about 1 cm. That is geometry, not a planner bug: NavFn
      # blocks cells at INSCRIBED, and the inscribed radius of this footprint is
      # 0.17 m -- the distance to the NEAREST edge -- while the rover reaches
      # 0.19 m at its widest. The centre can legally sit 0.17 m from an obstacle
      # with a corner 2 cm inside it.
      #
      # Padding inflates the footprint used for that calculation, so the
      # inscribed radius becomes 0.24 m and the body keeps ~5 cm of real
      # clearance. Cost: the rover now believes it is 52 cm wide and will refuse
      # gaps narrower than that. If it starts refusing doorways, this is why.
      footprint_padding: 0.07

      plugins: [nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        # BINARY, and this is the setting that made nav2 able to plan at all.
        #
        # In gradient mode this layer writes a graduated cost to every cell
        # within max_obstacle_distance of an obstacle. nav2 then merges layers
        # with CostmapLayer::updateWithMax, which takes the per-cell MAXIMUM and
        # therefore can raise a cost but never lower one. Costs accumulated and
        # never released: measured 2026-08-22, cells with 0.47 m of clearance
        # read INSCRIBED while cells with 0.45 m read FREE, separated by a sharp
        # axis-aligned line rather than a distance contour. Every goal from
        # 0.5 to 3.0 m failed with NO_VALID_PATH, in every direction.
        #
        # In binary mode the layer marks LETHAL only where the ESDF distance is
        # <= 0 -- actually inside an obstacle -- and FREE everywhere else, so
        # there is no gradient to accumulate. Immediately after the change every
        # one of those goals planned, with path length growing with distance
        # rather than saturating.
        #
        # The safety margin is NOT lost, because it was never this layer's job:
        # inflation_layer owns it, with inflation_radius 0.45 m. Having both
        # layers compute a distance falloff was double-counting, and the one
        # that merges by max is the one that could not clear itself.
        convert_to_binary_costmap: true
        # INERT while convert_to_binary_costmap is true -- it is the length of
        # the cost ramp in gradient mode, and binary mode has no ramp. Left at
        # the default so that turning binary mode off returns to stock
        # behaviour rather than to a half-tuned value.
        max_obstacle_distance: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Half the diagonal is ~0.13 m; inflating to 0.35 keeps a real margin
        # around a rover whose pose is good to ~7 cm and whose turning is
        # currently limited to arcs.
        # 0.45 and 2.0, from 0.35 and 3.0, on 2026-08-23.
        # Cost falls off as exp(-scaling * distance), so a HIGHER scaling decays
        # faster and lets the planner hug obstacles; lower spreads the penalty
        # further and makes it prefer the middle of open floor. This is what
        # actually buys distance from the pink -- footprint_padding only forbids
        # contact, it does not make a route prefer the clear middle of a room.
        inflation_radius: 0.45
        cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Publish the WHOLE costmap every cycle, not just incremental updates.
      # By default nav2 sends one full map on a size change and deltas after,
      # so a subscriber that connects later -- RViz, or a health check -- sees
      # nothing at all despite the costmap running perfectly. Costs bandwidth on
      # a 12 m grid; worth it for something you have to be able to look at.
      always_send_full_costmap: true
      footprint: "[[0.180, 0.190], [0.180, -0.190], [-0.170, -0.190], [-0.170, 0.190]]"
      # 7 cm of padding, added 2026-08-23 after the rover was seen grazing
      # obstacles by about 1 cm. That is geometry, not a planner bug: NavFn
      # blocks cells at INSCRIBED, and the inscribed radius of this footprint is
