      #   padding | inscribed | narrowest gap the planner accepts | real margin
      #   --------|-----------|-----------------------------------|------------
      #    0.07   |  0.24 m   |  0.48 m                           |  5 cm/side
      #    0.05   |  0.22 m   |  0.44 m                           |  3 cm/side
      #    0.03   |  0.20 m   |  0.40 m   <- here                 |  1 cm/side
      #    0.02   |  0.19 m   |  0.38 m                           |  0 cm/side
      #    0.00   |  0.17 m   |  0.34 m                           | -2 cm/side
      #
      # The rover is 0.38 m across the tyres. Read the last row: at ZERO padding
      # the planner would route it through a 0.35 m gap it physically cannot
      # enter, because the gate is the rear overhang and the body is wider than
      # that. **0.02 is the floor**, and it is not a safety margin -- it is the
      # correction that makes the inscribed radius equal the true half-width.
      # Only padding above 0.02 buys real clearance, at 1 cm per extra cm.
      #
      # At 0.07 the refused band was gaps of roughly 0.38-0.53 m: passable,
      # rejected. That is most interior doorways once nvblox's 0.05 m voxels
      # thicken each jamb. 0.03 narrows the band to 0.38-0.45 m and leaves
      # 1 cm/side of planner margin plus whatever the voxel rounding adds.
      #
      # SPINNING NEEDS MORE THAN PASSING. A rotation in place sweeps the
      # CIRCUMSCRIBED radius, hypot(0.180+p, 0.190+p):
      #   p=0.07 -> 0.36 m, needs 0.72 m of clear floor to turn around in
      #   p=0.03 -> 0.30 m, needs 0.61 m
      # The Spin recovery collision-checks against that, so padding also decides
      # whether the rover is allowed to turn its way out of a tight spot.
      #
      # What still protects it: inflation_layer below (0.45 m radius) makes the
      # planner PREFER open floor even where it is permitted to hug, and RPP's
      # forward collision sweep runs every tick. What is given up is honest:
      # 4 cm/side of planner margin, in exchange for the rover being willing to
      # use doorways. Raise this first if it starts grazing again.
      footprint_padding: 0.03
      plugins: [nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        # BINARY, and this is the setting that made nav2 able to plan at all.
        #
        # In gradient mode this layer writes a graduated cost to every cell
        # within max_obstacle_distance of an obstacle. nav2 then merges layers
        # with CostmapLayer::updateWithMax, which takes the per-cell MAXIMUM and
        # therefore can raise a cost but never lower one. Costs accumulated and
        # never released: measured 2026-08-22, cells with 0.47 m of clearance
        # read INSCRIBED while cells with 0.45 m read FREE, separated by a sharp
        # axis-aligned line rather than a distance contour. Every goal from
        # 0.5 to 3.0 m failed with NO_VALID_PATH, in every direction.
        #
        # In binary mode the layer marks LETHAL only where the ESDF distance is
        # <= 0 -- actually inside an obstacle -- and FREE everywhere else, so
        # there is no gradient to accumulate. Immediately after the change every
        # one of those goals planned, with path length growing with distance
        # rather than saturating.
        #
        # The safety margin is NOT lost, because it was never this layer's job:
        # inflation_layer owns it, with inflation_radius 0.45 m. Having both
        # layers compute a distance falloff was double-counting, and the one
        # that merges by max is the one that could not clear itself.
        convert_to_binary_costmap: true
        # INERT while convert_to_binary_costmap is true -- it is the length of
        # the cost ramp in gradient mode, and binary mode has no ramp. Left at
        # the default so that turning binary mode off returns to stock
        # behaviour rather than to a half-tuned value.
        max_obstacle_distance: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # 0.45 and 2.0, from 0.35 and 3.0, on 2026-08-23.
        # Cost falls off as exp(-scaling * distance), so a HIGHER scaling decays
        # faster and lets the planner hug obstacles; lower spreads the penalty
        # further and makes it prefer the middle of open floor. This is what
        # actually buys distance from the pink -- footprint_padding only forbids
        # contact, it does not make a route prefer the clear middle of a room.
        inflation_radius: 0.45
        cost_scaling_factor: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    cycle_frequency: 10.0
    # SPIN RESTORED 2026-09-11 (TODO 40). It had been absent since TODO 14, on
    # the grounds that this rover cannot turn in place. It can, since 2026-08-22
    # -- 65 deg/s, measured on the floor -- and with Spin gone the only recovery
    # left was BackUp, into the one direction this rover cannot see.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

    # THESE THREE ARE THE TRAP, and they are why re-enabling Spin is not just
    # adding it to the list above. Spin reads them from the SERVER, unnamespaced
    # (nav2_behaviors/src/plugins/spin.cpp, onConfigure), and clamps every
    # command into [min_rotational_vel, max_rotational_vel]. The old values were
    # 0.6 / 0.2 / 1.0 -- ENTIRELY INSIDE the 0.8 rad/s scrub breakaway measured
    # in TODO 14. Spin would have commanded 0.2-0.6 rad/s, the wheels would have
    # sat still, and the behaviour would have timed out: the exact symptom that
    # made "this rover cannot pivot" look true in the first place. Restoring
    # Spin with stock numbers would have reproduced the original bug and
    # confirmed the wrong diagnosis a second time.
    #
    # 1.5 matches the velocity_smoother's angular cap so nothing downstream
    # clips it (~0.42 rad/s actual, 24 deg/s -- a quarter turn in ~4 s).
    max_rotational_vel: 1.5
    # 1.0, not 0.2. The floor must sit ABOVE the breakaway, because Spin slows
    # as it approaches its target angle: with a low floor the last few degrees
    # are commanded below 0.8 and the rover stops short with the behaviour still
    # running. 1.0 commanded is ~0.21 rad/s actual -- slow, but moving.
    min_rotational_vel: 1.0
    # 10.0, same reasoning as the controller's max_angular_accel: the ramp is
    # acc_lim * dt, and at 1.0 rad/s^2 the first 100 ms tick commands 0.1 rad/s,
    # deep in the deadband. 10.0 clears 0.8 on the very first tick.
    rotational_acc_lim: 10.0
    # 1.0 s, from the 2.0 default. Spin collision-checks the CIRCUMSCRIBED
    # sweep (0.30 m at the padding set above, so 0.61 m of floor needed to turn
    # around in). Projecting 2 s of rotation ahead through a costmap that is
    # mostly unobserved vetoes turns the rover could make; 1 s still refuses a
    # spin into something it can actually see.
    simulate_ahead_time: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # Angular limits raised from 1.0 / 2.0 on 2026-08-23. The old 1.0 rad/s cap
    # allowed at most 0.21 rad/s of ACTUAL rotation (12 deg/s), and the 2.0
    # rad/s^2 accel would have re-imposed the deadlock the controller's own
    # max_angular_accel was raised to escape. 2.5 commanded is about 0.7 rad/s
    # actual (40 deg/s); linear limits are unchanged.
    max_velocity: [0.20, 0.0, 1.5]
    min_velocity: [-0.10, 0.0, -1.5]
    max_accel: [1.5, 0.0, 10.0]
    max_decel: [-1.5, 0.0, -10.0]
    odom_topic: /odom
    odom_duration: 0.1
