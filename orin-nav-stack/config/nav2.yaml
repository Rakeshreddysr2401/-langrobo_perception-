# Nav2 for the LangRobo rover, REAL profile (RealSense D555 + cuVSLAM + ESP32).
# Derived from nav2_sim.yaml with exactly these changes:
#   - wall clock (use_sim_time: False everywhere)
#   - bt_navigator global_frame: map (Pi5 goals arrive in map; cuVSLAM
#     publishes map->odom; costmaps stay in odom like the NVIDIA reference)
#   - DIFFERENTIAL drive: the real rover is a 2-motor L298N chassis, not the
#     sim's mecanum X3 — MPPI DiffDrive, vy locked to 0
#   - speeds capped to the ESP32 firmware envelope (cmd 0.30 m/s = full PWM;
#     NOTE the firmware is open-loop: commanded m/s != physical m/s. MPPI
#     still converges — cuVSLAM odometry closes the loop — but do not tune
#     critics until wheel calibration is revisited)
#   - collision monitor watches /camera0/depth/color/points (D555 driver);
#     verify that topic exists during bring-up or the monitor's source
#     timeout will hold the robot still
#   - footprint: sim X3 dims kept — MEASURE the real chassis and update
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    bt_loop_duration: 10
    # 20ms ack timeout aborts goals mid-drive on the loaded Orin ("Timed out
    # while waiting for action server to acknowledge goal request",
    # 2026-07-16 first live approach_object test)
    default_server_timeout: 100
    # Custom tree = default minus the BackUp recovery (blind reverse into
    # unseen space — no rear sensing). Path is the in-container repo mount.
    default_nav_to_pose_bt_xml: "/opt/orin-nav/config/bt_navigate_to_pose.xml"
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False
collision_monitor:
  ros__parameters:
    use_sim_time: False
    enabled: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"  # dead-zone compensated onto /cmd_vel by cmd_vel_deadband.py
    # The ~3.5Hz nvblox pointcloud is stamped ms AHEAD of the latest cuVSLAM
    # odom TF; with base_shift_correction on, every lookup failed with
    # "extrapolation into the future" and the monitor held the robot at zero
    # (2026-07-16 live test). At 0.30 m/s the sub-100ms shift is negligible —
    # use the latest transform instead.
    base_shift_correction: False
    transform_tolerance: 0.6
    # Source is nvblox back_projected_depth: measured 2.8-3.3Hz with max gaps
    # up to 1.5s under GPU load (2026-07-18 live, camera-only). A 1.0s timeout
    # was TIGHTER than the source's worst-case interval, so every slow frame
    # tripped "stop due to invalid source" and held the robot at zero
    # indefinitely. 2.5s clears the measured jitter (and leaves headroom for
    # when YOLO shares the GPU); at 0.30 m/s that is ~0.75m of stale-data
    # travel, backstopped by the nvblox costmap in the planners. Raising the
    # source rate is the real fix — tracked as a follow-up.
    source_timeout: 2.5
    observation_sources: ["depth_points"]
    depth_points:
      type: "pointcloud"
      # nvblox's GPU back-projected depth (~3Hz measured): the D555/DDS driver
      # has no pointcloud filter (pointcloud.enable undeclared on this camera).
      topic: "/nvblox_node/back_projected_depth/camera0_depth_optical_frame"
      min_height: 0.03
      max_height: 0.40
    polygons: ["SlowZone", "SafeZone"]
    # Two rings: slow first, then hard stop. The depth source is only ~5Hz —
    # at 0.30 m/s the robot covers ~6cm between updates, so the old 0.18m
    # stop ring left 3cm of margin past the 0.15m footprint nose.
    SlowZone:
      type: "circle"
      radius: 0.45
      action_type: "slowdown"
      # NOTE: while cmd_vel_deadband.py is in the loop it re-floors linear
      # commands at 0.20 m/s, so this ratio only truly bites after the
      # ESP32-firmware PWM remap replaces the shim (Phase 1 gating item).
      slowdown_ratio: 0.4
      min_points: 6
      enabled: True
    SafeZone:
      type: "circle"
      radius: 0.25
      action_type: "stop"
      min_points: 6
      enabled: True
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    # Position-based arrival (was StoppedGoalChecker, 2026-07-18). The pulsing
    # PWM-deadband drive means the rover is rarely "fully stopped" at the instant
    # it first enters the tolerance disc; StoppedGoalChecker also required
    # |v|<0.1 and could miss that instant and hang the goal. SimpleGoalChecker
    # latches arrival on POSITION alone (stateful) — the correct check for
    # "go to this coordinate". Tolerances unchanged.
    #   0.10: approach stops at the FAR edge of this circle (measured
    #   2026-07-17: 0.45 standoff + 0.20 tol = 0.65m center-to-object), putting
    #   the robot front 30-40cm from the object, per spec.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.30
      # Reverse is blind (no rear sensing, local costmap unknown behind the
      # robot) — allow only short escape nudges, not real reverse driving.
      vx_min: -0.10
      vy_max: 0.0
      # 1.2 rad/s risks cuVSLAM tracking loss during in-place turns: visual-only
      # (IMU off) at ~20Hz effective with occasional 140ms frame gaps means up to
      # ~10deg between tracked frames. 0.8 keeps the worst gap under ~6.5deg.
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.6
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.0
        critical_weight: 20.0
        consider_footprint: True
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
docking_server:
  ros__parameters:
    use_sim_time: False
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      staging_x_offset: -0.5
    docks: ['home_dock']
    home_dock:
      type: 'simple_dock'
      frame: odom
      pose: [0.0, 0.0, 0.0]
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      footprint_padding: 0.02
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.6
      footprint: "[ [0.15, 0.085], [0.15, -0.085], [-0.15, -0.085], [-0.15, 0.085] ]"
      always_send_full_costmap: True
      plugins: ['nvblox_layer', 'inflation_layer']
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # 0.35/10.0 let paths hug walls (user-observed near-crashes 2026-07-19);
        # wider radius + gentler falloff pushes MPPI/planner further out
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      footprint_padding: 0.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[ [0.15, 0.085], [0.15, -0.085], [-0.15, -0.085], [-0.15, 0.085] ]"
      resolution: 0.05
      width: 40
      height: 40
      origin_x: -20.0
      origin_y: -20.0
      # True: never-seen cells stay NO_INFORMATION so the planner can refuse
      # them (nvblox layer leaves unknown slice cells untouched — verified in
      # nvblox_costmap_layer.cpp 4.4.0). With False, the forward-only D555
      # left everything outside its cone "free" and NavFn planned through
      # unseen walls (wall strikes while testing, 2026-07-17 analysis).
      # Local costmap intentionally stays False: unknown-as-lethal there
      # would paralyze MPPI (the floor behind/under the robot is never seen).
      track_unknown_space: True
      always_send_full_costmap: True
      plugins: ['nvblox_layer', 'inflation_layer']
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # 0.35/10.0 let paths hug walls (user-observed near-crashes 2026-07-19);
        # wider radius + gentler falloff pushes MPPI/planner further out
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 0.15 (was 0.3, fixed 2026-07-18): when a goal is UNREACHABLE (sits in
      # unknown/unseen space), NavFn routes to the nearest reachable cell WITHIN
      # tolerance — which can be the robot's OWN cell — and returns a ~zero-
      # length path the controller instantly "reaches", so an impossible goal
      # FALSELY reported SUCCESS with no motion (diagnosed live 2026-07-18).
      # 0.15 (3 cells) still lets a goal that lands just inside inflation
      # succeed, but makes truly out-of-map goals FAIL cleanly so the brain
      # knows the goal was not reached instead of thinking it arrived.
      tolerance: 0.15
      use_astar: false
      # Only plan through space the camera has actually seen (pairs with
      # global_costmap track_unknown_space: True). Consequence: a goal with
      # no fully-seen corridor fails with "no path" instead of driving blind
      # — the mission flow must look toward the goal first (pixel-grounded
      # goals already imply line of sight).
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # All plugins must stay loaded: BT action nodes wait for their action
    # server at XML LOAD time, so removing e.g. backup breaks tree loading
    # entirely (bt_navigator activation failure, seen live 2026-07-17).
    # Blind maneuvers are instead removed from the TREE:
    # bt_navigator default_nav_to_pose_bt_xml (no-blind-backup variant).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.6
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.2]
    min_velocity: [-0.10, 0.0, -1.2]  # match MPPI vx_min: reverse is blind
    max_accel: [1.5, 1.5, 2.5]
    max_decel: [-1.5, -1.5, -2.5]
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
