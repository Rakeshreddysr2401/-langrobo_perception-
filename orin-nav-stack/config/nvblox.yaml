# nvblox overrides for the REAL robot profile (RealSense D555 + cuVSLAM).
# Loaded on top of nvblox_examples_bringup/config/nvblox/nvblox_base.yaml.
#
# Reconstruction is anchored to cuVSLAM's odom frame (NVIDIA reference wiring:
# smooth, no relocalization jumps in the costmaps). Goals arrive in `map`
# (Pi5 contract); bt_navigator transforms them through cuVSLAM's map->odom.
/**:
  ros__parameters:
    global_frame: "odom"
    num_cameras: 1
    use_depth: true
    # RGB adds mesh color only — skip it; the Orin budget goes to depth + YOLO.
    use_color: false
    use_lidar: false
    esdf_mode: "2d"
    publish_esdf_distance_slice: true
    map_clearing_frame_id: "base_link"
    # Live driver publishes best-effort sensor QoS (sim used reliable).
    input_qos: "SENSOR_DATA"
    # Obstacle band, in ODOM z (base_link origin sits at z=0).
    #
    # min was 0.05 and that mapped THE FLOOR AS AN OBSTACLE (diagnosed live
    # 2026-08-10). Deprojecting the depth centre column showed open floor landing
    # at z = +0.04 m (0.58 m and 0.75 m ahead) — just 1 cm under the old 0.05
    # threshold, i.e. well inside the depth noise, which is extra-sparse because
    # the IR emitter is OFF for cuVSLAM scale. Result: a solid inflation plateau
    # across the full +-1 m width starting ~0.25 m ahead of the robot, with no
    # lethal cells anywhere — pure floor. MPPI then crawled at 0.082 m/s (vx_max
    # is 0.30) and the collision monitor's SlowZone cut that to 0.033 m/s, so the
    # rover covered 0.9 cm in 30 s and nav2 aborted on "Failed to make progress".
    #
    # 0.12 puts ~8 cm of margin above the observed floor plane. Cost: obstacles
    # shorter than ~12 cm are no longer mapped. The 85 mm wheels make most of
    # those non-issues, and safety_guard's depth bumper still sees them.
    #
    # UPDATE 2026-08-10 (Phase 1): the camera-height TF IS NOW FIXED. nodes/floor_probe.py
    # measured open floor at +0.037 m with the old z=0.20 TF; after correcting the static
    # TF to z=0.163 the floor deprojects to +0.000 m (16-84%: -0.002..+0.004, 19.5k points).
    #
    # So the 0.12 below is now OVER-CONSERVATIVE — it exists only to dodge an error that no
    # longer exists, and it costs us every obstacle shorter than 12 cm. It can come down
    # toward ~0.06 (still ~6 cm above the measured floor, and above the residual +1.07 deg
    # nose-up pitch which lifts floor to ~+0.009 m at 1.25 m range).
    #
    # NOT changed yet ON PURPOSE: this alters what nav2 treats as an obstacle, so it must be
    # validated while driving (ThingsTodo.md Phase 2). After lowering, confirm the costmap
    # has no wide nonzero-cost band with zero lethal cells -- that pattern IS the floor.
    # Re-run nodes/floor_probe.py after ANY camera remount before touching this.
    static_mapper:
      esdf_slice_min_height: 0.12
      esdf_slice_max_height: 0.40
      esdf_slice_height: 0.20

    # MEASURED 2026-08-10 — do NOT trust back_projected_depth as a safety source.
    # It is nav2's collision_monitor source (config/nav2.yaml), but on this rig it
    # publishes at ~0.5 Hz with gaps up to 7.3 s, and stalled ~10 s during a live
    # drive. The monitor's source_timeout is 2.5 s, so it spends most of its time
    # logging "Ignoring the source" — nav2's collision layer effectively has NO
    # obstacle input. (When a source is stale the monitor does not brake; it just
    # ignores it, so this is a silent loss of protection, not a false stop.)
    # Raising publish_debug_vis_rate_hz to 10.0 and back_projection_subsampling to
    # 4 was TRIED and did NOT change the rate — that parameter does not gate this
    # topic, so both were reverted rather than left as a misleading no-op.
    # Effective obstacle protection today is therefore:
    #   * MPPI ObstaclesCritic on the nvblox costmap  (static_map_slice, 9.4 Hz — healthy)
    #   * safety_guard depth bumper                   (direct off 21 Hz depth, ~6 Hz checks)
    #   * safety_guard nvblox occupancy bumper        (remembers walls in the blind zone)
    # TODO: to give nav2's collision_monitor a real source, publish a strided
    # depth->PointCloud2 at ~10 Hz (same numpy trick safety_guard already uses).
